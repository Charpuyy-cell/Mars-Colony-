
name: Initialize Mars Colony TWA

on:
  workflow_dispatch:

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Bubblewrap CLI
        run: |
          npx --yes @bubblewrap/cli --version

      - name: Check Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          
