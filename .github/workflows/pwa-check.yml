name: Check Mars Colony PWA

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate PWA
        run: npx --yes @bubblewrap/cli validate --url=https://charpuyy-cell.github.io/Mars-Colony-/
        
